trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: false  


- task: NodeTool@0
  inputs:
    versionSpec: '12.x'  
    checkLatest: true
  displayName: 'Setup Node.js'



- script: |
    npm install
  displayName: 'Npm Install'

